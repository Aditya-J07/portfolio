<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Aditya Jha - Game Developer & Full-Stack Developer. Building interactive experiences from 2D games to full-stack applications." />
  <meta name="keywords" content="Aditya Jha, Game Developer, Full-Stack Developer, Godot, React, Portfolio" />
  <meta name="author" content="Aditya Jha" />

  <!-- Open Graph -->
  <meta property="og:title" content="Aditya Jha - Portfolio" />
  <meta property="og:description" content="Game Developer & Full-Stack Developer building interactive experiences." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Archivo Black, Space Mono, Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />

  <!-- Anti-Flash Theme Initializer -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('portfolio_theme');
        var theme = (saved === 'light' || saved === 'middle' || saved === 'dark') ? saved : 'middle';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'middle');
      }
    })();
  </script>

  <title>Aditya Jha | Portfolio</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
